<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2d31"><meta name="description" content="Cortex Browser — a quieter corner of the internet.">
<title>Cortex•Browser</title>
<style>
:root{color-scheme:dark;--bg:#2b2d31;--panel:#383a40;--panel2:#42454c;--orange:#ff9b45;--text:#f2f2f2;--muted:#aeb1b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif;min-height:100vh}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #3d3f45}.brand{font-weight:800;letter-spacing:-.5px}.dot{color:var(--orange)}button,input{font:inherit}button{border:0;border-radius:12px;background:var(--panel2);color:var(--text);padding:11px 14px;cursor:pointer}.pl{background:var(--orange);color:#191919;font-weight:950;border-radius:10px;padding:10px 15px}.home{min-height:calc(100dvh - 116px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px 65px}.logo{font-size:clamp(40px,10vw,60px);font-weight:850;letter-spacing:-2.5px;margin-bottom:26px}.search{display:flex;gap:8px;width:100%;max-width:590px}.search input{min-width:0;flex:1;background:var(--panel);border:1px solid #555861;border-radius:16px;padding:16px;color:white;outline:none}.search input:focus{border-color:var(--orange)}.search button,.primary{background:var(--orange);color:#1b1b1b;font-weight:800}.shortcuts{display:flex;gap:12px;margin-top:25px;flex-wrap:wrap;justify-content:center}.shortcut{width:72px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--muted);font-size:12px;cursor:pointer}.shortcut b{width:44px;height:44px;border-radius:14px;background:var(--panel);display:grid;place-items:center;color:white;font-size:18px}.hint{margin-top:30px;color:#777b84;font-size:12px}.page{padding:12px 16px 100px;max-width:800px;margin:auto}.heading{font-size:27px;margin:14px 0 4px}.sub{color:var(--muted);font-size:14px;margin-bottom:20px}.card{background:var(--panel);border:1px solid #494c54;border-radius:16px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center}.ico{width:44px;height:44px;border-radius:13px;background:var(--panel2);display:grid;place-items:center;font-size:22px;flex-shrink:0}.grow{flex:1;min-width:0}.desc{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}.empty{text-align:center;padding:42px 15px;background:var(--panel);border-radius:18px;margin-top:22px}.empty .big{font-size:38px;margin-bottom:10px}.footer{position:fixed;bottom:0;left:0;right:0;background:#24262a;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #45474d}.footer button{background:transparent;padding:7px 14px;font-size:21px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#151619;border:1px solid #555;border-radius:12px;padding:12px 16px;display:none;max-width:90%;text-align:center;z-index:5}.note{font-size:12px;color:#858992;line-height:1.5;margin-top:18px}.filter{width:100%;padding:14px;border-radius:13px;border:1px solid #555861;background:var(--panel);color:white;margin-bottom:12px}.tag{font-size:11px;color:#191919;background:var(--orange);border-radius:99px;padding:4px 8px;font-weight:800}@media(min-width:650px){.home{padding-bottom:80px}.page{padding-top:24px}}
</style></head>
<body>
<header class="top"><div class="brand">Cortex<span class="dot">•</span>Browser</div><button class="pl" onclick="location.hash='plugins'" aria-label="Open plugins">PL</button></header>
<main id="app"></main>
<nav class="footer"><button onclick="home()" aria-label="Home">⌂</button><button onclick="goBack()" aria-label="Back">‹</button><button onclick="goForward()" aria-label="Forward">›</button><button onclick="location.hash='plugins'" aria-label="Plugins">🧩</button><button onclick="toast('A fresh tab. A fresh start.')" aria-label="New tab">＋</button></nav>
<div id="toast" class="toast" role="status"></div>
<script>
const plugins=[
['✎','Quick Notes','Save small notes locally in this browser.','Productivity'],
['◐','Reader Mode','A calmer reading view for articles you open here.','Reading'],
['◎','Focus Timer','A tiny reminder to take a focused break.','Productivity'],
['↗','Clean Links','Strip common tracking parameters from a pasted URL.','Privacy'],
['⌗','Calculator','Do quick calculations without leaving the page.','Tools'],
['⚿','Password Maker','Generate a random password on demand.','Security'],
['文','Mini Translate','Open a translation helper.','Language'],
['☾','Night Shift','Toggle the darker start-page theme.','Appearance']
];
let installed=JSON.parse(localStorage.getItem('cortex-installed')||'[]');
function save(){localStorage.setItem('cortex-installed',JSON.stringify(installed))}
function home(){location.hash='';render()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.style.display='none',2400)}
function search(){let q=document.getElementById('q')?.value.trim();if(!q)return;let url=/^https?:\/\//i.test(q)?q:/^[\w-]+\.[a-z]{2,}(\/.*)?$/i.test(q)?'https://'+q:'https://www.google.com/search?q='+encodeURIComponent(q);window.open(url,'_blank','noopener')}
function render(){let app=document.getElementById('app'),h=location.hash.toLowerCase();
if(h==='#plugins'){app.innerHTML='<section class="page"><h1 class="heading">Your plugins</h1><div class="sub">Your personal Cortex toolbox</div>'+(installed.length?installed.map(id=>{let p=plugins.find(x=>x[1]===id);return p?card(p,true):''}).join(''):'<div class="empty"><div class="big">🧩</div><b>No plugins installed yet</b><p class="sub">Your little toolbox is waiting.</p><button class="primary" onclick="location.hash=\'store\'">Install Plugin</button></div>')+'<div class="card" onclick="document.getElementById(\'pluginfile\').click()" style="cursor:pointer"><div class="ico">＋</div><div class="grow"><b>Import plugin</b><div class="desc">Select a plugin file from your device</div></div>›</div><input id="pluginfile" type="file" accept=".zip,.json,.js,.html" hidden onchange="importPlugin(this)"><div class="note">This web demo can select a plugin file, but cannot run arbitrary Chrome/Brave extensions or browser APIs. Built-in Cortex tools work here.</div></section>';
}else if(h==='#store'){app.innerHTML='<section class="page"><h1 class="heading">BP Store</h1><div class="sub">Cortex Browser Plugins · Useful tools and tiny experiments</div><input id="filter" class="filter" placeholder="Search plugins…" oninput="filterStore()"><div id="catalog">'+plugins.map(p=>card(p,installed.includes(p[1]))).join('')+'</div><div class="note">Plugin preferences are stored locally on this device.</div></section>';
}else{app.innerHTML='<section class="home"><div class="logo">Cortex<span class="dot">•</span></div><form class="search" onsubmit="event.preventDefault();search()"><input id="q" placeholder="Search the web or enter an address" autocomplete="off"><button type="submit">Search</button></form><div class="shortcuts"><div class="shortcut" onclick="openSite(\'https://www.google.com\')"><b>G</b>Google</div><div class="shortcut" onclick="openSite(\'https://www.youtube.com\')"><b>▶</b>YouTube</div><div class="shortcut" onclick="openSite(\'https://wikipedia.org\')"><b>W</b>Wiki</div><div class="shortcut" onclick="location.hash=\'store\'"><b>＋</b>Plugins</div></div><div class="hint">A quieter corner of the internet.</div><div class="shortcuts">'+installed.map(id=>{let p=plugins.find(x=>x[1]===id);return p?'<div class="shortcut" onclick="runPlugin('+JSON.stringify(p[1])+')" title="'+p[2]+'"><b>'+p[0]+'</b>'+p[1]+'</div>':''}).join('')+'</div></section>'}}
function card(p,isInstalled){return '<div class="card"><div class="ico">'+p[0]+'</div><div class="grow"><b>'+p[1]+'</b><div class="desc">'+p[2]+'</div><div class="desc">'+p[3]+'</div></div>'+(isInstalled?'<button onclick="removePlugin('+JSON.stringify(p[1])+')">Remove</button>':'<button class="primary" onclick="installPlugin('+JSON.stringify(p[1])+')">Install</button>')+'</div>'}
function installPlugin(id){if(!installed.includes(id))installed.push(id);save();toast(id+' installed');render()}
function removePlugin(id){installed=installed.filter(x=>x!==id);save();render()}
function filterStore(){let q=document.getElementById('filter').value.toLowerCase();document.getElementById('catalog').innerHTML=plugins.filter(p=>p.join(' ').toLowerCase().includes(q)).map(p=>card(p,installed.includes(p[1]))).join('')||'<div class="empty">No matching plugins.</div>'}
function openSite(url){window.open(url,'_blank','noopener')}
function importPlugin(input){let f=input.files[0];if(!f)return;toast('Selected '+f.name+'. Custom plugin execution is not enabled in this web demo.');input.value=''}
function runPlugin(id){if(id==='Calculator'){let v=prompt('Enter a calculation (basic arithmetic):');if(v!==null&&v.trim())try{if(!/^[0-9+\-*/(). %]+$/.test(v))throw Error();toast('Result: '+Function('"use strict";return ('+v+')')())}catch(e){toast('Could not calculate that.')}}else if(id==='Quick Notes'){let n=prompt('Quick note',localStorage.getItem('cortex-note')||'');if(n!==null){localStorage.setItem('cortex-note',n);toast('Note saved on this device')}}else if(id==='Focus Timer')toast('Tiny challenge: focus on one thing for 20 minutes.');else if(id==='Password Maker'){let chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';let out='';for(let i=0;i<18;i++)out+=chars[Math.floor(Math.random()*chars.length)];prompt('Generated password — copy it:',out)}else if(id==='Clean Links'){let u=prompt('Paste a URL to clean');if(u)try{let x=new URL(u);['utm_source','utm_medium','utm_campaign','utm_term','utm_content','fbclid','gclid'].forEach(k=>x.searchParams.delete(k));prompt('Clean URL:',x.href)}catch(e){toast('That URL does not look valid.')}}else if(id==='Mini Translate')openSite('https://translate.google.com');else if(id==='Reader Mode')toast('Tip: open an article in its own tab for easier reading.');else if(id==='Night Shift'){let dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#202125';document.documentElement.style.setProperty('--bg',dark?'#2b2d31':'#202125');toast('Theme changed')}else toast(id)}
function goBack(){if(location.hash)home();else toast('Use your browser’s back button to return from a website.')}
function goForward(){toast('Nothing ahead yet.')}
window.addEventListener('hashchange',render);render();
</script></body></html>
