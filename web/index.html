<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayurones</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="sidebar">
  <div class="brand">Ayurones</div>
  <button id="newChat">+ Новый чат</button>
  <div class="side-section"><span>Система</span><div id="status" class="status">Проверка...</div></div>
  <div class="side-section"><span>Обучение</span><button id="learnOpen" class="secondary">Добавить знания</button></div>
</aside>
<main>
<header><button id="menu" aria-label="Меню">☰</button><div><h1>Ayurones</h1><small id="modelName">локальная модель</small></div></header>
<section id="messages" aria-live="polite">
  <div class="welcome"><div class="logo">A</div><h2>Чем могу помочь?</h2><p>Ayurones работает через локальную языковую модель и может расширять свои знания.</p></div>
</section>
<form id="chatForm"><textarea id="input" rows="1" placeholder="Напишите сообщение..." autocomplete="off"></textarea><button id="send" type="submit">↑</button></form>
</main>
<dialog id="learnDialog">
<form id="learnForm" method="dialog">
<h2>Обучить Ayurones</h2>
<input id="learnTitle" placeholder="Название материала" maxlength="300">
<textarea id="learnText" placeholder="Вставьте текст, который нужно добавить в базу знаний..." required></textarea>
<div class="dialog-actions"><button type="button" id="learnClose" class="secondary">Отмена</button><button type="submit">Добавить</button></div>
</form>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
