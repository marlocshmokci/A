name: Build Ayurones Desktop

on:
  push:
    branches: ["main"]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Create portable desktop shell
        shell: pwsh
        run: |
          flutter create --platforms=windows desktop/ayurones
          (Get-Content desktop/ayurones/pubspec.yaml) -replace '^version: .*$', 'version: 0.2.0+20' | Set-Content desktop/ayurones/pubspec.yaml

      - name: Build Windows
        working-directory: desktop/ayurones
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path desktop/ayurones/build/windows/x64/runner/Release/* -DestinationPath Ayurones-Desktop-v0.2.0-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ayurones-Desktop-v0.2.0-windows-x64
          path: Ayurones-Desktop-v0.2.0-windows-x64.zip
          retention-days: 30
