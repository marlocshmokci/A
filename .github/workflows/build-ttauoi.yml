name: Build TTAuOI

on:
  workflow_dispatch:
    inputs:
      source_apk_url:
        description: "Direct HTTPS URL of the original TikTok APK"
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_URL: ${{ inputs.source_apk_url || secrets.TTAUOI_SOURCE_APK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check source APK URL
        shell: bash
        run: |
          if [ -z "$APK_URL" ]; then
            echo "::error::Provide source_apk_url when starting manually, or configure TTAUOI_SOURCE_APK_URL."
            exit 1
          fi
          case "$APK_URL" in
            https://*) ;;
            *) echo "::error::Only HTTPS source APK URLs are accepted."; exit 1 ;;
          esac
      - name: Download original TikTok APK
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-delay 3 --output TikTok-source.apk "$APK_URL"
          test -s TikTok-source.apk
          ls -lh TikTok-source.apk
          sha256sum TikTok-source.apk
      - name: Patch TTAuOI into TikTok APK
        shell: bash
        run: python3 tools/patch_tiktok.py TikTok-source.apk --out TTAuOI-v2.0.5-unsigned.apk
      - name: Generate CI signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore ttauoi-ci.jks -storepass ttauoi123 -keypass ttauoi123 -alias ttauoi -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TTAuOI, OU=TTAuOI, O=TTAuOI, L=DE, C=DE"
      - name: Sign APK
        shell: bash
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ttauoi-ci.jks -storepass ttauoi123 -keypass ttauoi123 -signedjar TTAuOI-v2.0.5.apk TTAuOI-v2.0.5-unsigned.apk ttauoi
          jarsigner -verify TTAuOI-v2.0.5.apk
          sha256sum TTAuOI-v2.0.5.apk
          ls -lh TTAuOI-v2.0.5.apk
      - name: Publish full APK
        uses: actions/upload-artifact@v4
        with:
          name: TTAuOI-v2.0.5-full
          path: TTAuOI-v2.0.5.apk
          if-no-files-found: error
          retention-days: 7
