name: Build TTAuOI
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: gradle :app:assembleDebug
        working-directory: apps/ttauoi
      - run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify apps/ttauoi/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp apps/ttauoi/app/build/outputs/apk/debug/app-debug.apk dist/TTAuOI-v2.0.5-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TTAuOI-v2.0.5-debug
          path: dist/TTAuOI-v2.0.5-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.5
          name: TTAuOI v2.0.5
          files: dist/TTAuOI-v2.0.5-debug.apk
