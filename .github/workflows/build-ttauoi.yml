name: Build TTAuOI

on:
  workflow_dispatch:
    inputs:
      source_apk_url:
        description: "Direct HTTPS URL of the exact original TikTok APK"
        required: true
        type: string
      source_apk_sha256:
        description: "Expected SHA-256 of the source APK"
        required: false
        default: "7528c76344ae2636ed33895699dae441fdc58f87c5370ae97dc6ced8060d5adb"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_URL: ${{ inputs.source_apk_url }}
      APK_SHA256: ${{ inputs.source_apk_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check source URL
        shell: bash
        run: |
          case "${APK_URL}" in
            https://*) ;;
            *) echo "::error::Only HTTPS source APK URLs are accepted."; exit 1 ;;
          esac

      - name: Download exact original TikTok APK
        shell: bash
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --output TikTok-source.apk "${APK_URL}"
          test -s TikTok-source.apk
          ACTUAL_SHA=$(sha256sum TikTok-source.apk | awk '{print $1}')
          echo "Source size: $(stat -c%s TikTok-source.apk) bytes"
          echo "Source SHA-256: ${ACTUAL_SHA}"
          if [ "${ACTUAL_SHA}" != "${APK_SHA256}" ]; then
            echo "::error::Source APK SHA-256 mismatch. Expected ${APK_SHA256}, got ${ACTUAL_SHA}."
            exit 1
          fi

      - name: Patch TTAuOI into TikTok APK
        shell: bash
        run: |
          python3 tools/patch_tiktok.py TikTok-source.apk --out TTAuOI-v2.0.5-unsigned.apk
          test -s TTAuOI-v2.0.5-unsigned.apk
          ls -lh TTAuOI-v2.0.5-unsigned.apk

      - name: Generate CI signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore ttauoi-ci.jks -storepass ttauoi123 -keypass ttauoi123 -alias ttauoi -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=TTAuOI, OU=TTAuOI, O=TTAuOI, L=DE, C=DE"

      - name: Sign APK
        shell: bash
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore ttauoi-ci.jks -storepass ttauoi123 -keypass ttauoi123 -signedjar TTAuOI-v2.0.5.apk TTAuOI-v2.0.5-unsigned.apk ttauoi
          jarsigner -verify TTAuOI-v2.0.5.apk
          test "$(stat -c%s TTAuOI-v2.0.5.apk)" -ge 265000000
          sha256sum TTAuOI-v2.0.5.apk

      - name: Publish full APK
        uses: actions/upload-artifact@v4
        with:
          name: TTAuOI-v2.0.5-full
          path: TTAuOI-v2.0.5.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish checksum
        shell: bash
        run: sha256sum TTAuOI-v2.0.5.apk | tee SHA256SUMS.txt

      - name: Publish checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTAuOI-v2.0.5-checksum
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
