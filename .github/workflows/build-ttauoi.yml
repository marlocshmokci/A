name: Build TTAuOI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build settings/core APK
        working-directory: apps/ttauoi
        run: gradle :app:assembleDebug

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify             apps/ttauoi/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTAuOI-v2.0.5-settings-debug
          path: apps/ttauoi/app/build/outputs/apk/debug/app-debug.apk
