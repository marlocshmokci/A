name: Build Ayurones Drops APK

on:
  push:
    paths:
      - "games/drops/**"
      - ".github/workflows/build-drops.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/drops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ayurones-Drops-v1.0
          path: games/drops/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
