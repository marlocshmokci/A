name: Build TTA standalone

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/tta-feed/**'
      - '.github/workflows/build-tta-feed.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tta-feed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -n 5
          ls "$ANDROID_HOME/build-tools" | tail -n 5
      - name: Build
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          stat -c '%s bytes' app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTA-standalone-debug
          path: apps/tta-feed/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
