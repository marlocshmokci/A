name: Build TTA standalone

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/tta-feed/**'
      - '.github/workflows/build-tta-feed.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tta-feed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          stat -c '%s bytes' app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTA-standalone-debug
          path: apps/tta-feed/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
