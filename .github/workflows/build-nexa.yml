name: Build Ayuron

on:
  push:
    paths:
      - 'apps/ayuron/**'
      - 'backend/**'
      - '.github/workflows/build-ayuron.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ayuron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -n 5
      - name: Build
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          stat -c '%s bytes' app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ayuron-1.0.0-debug
          path: apps/ayuron/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
