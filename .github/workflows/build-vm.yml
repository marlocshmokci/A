name: Build Ayurones VM

on: [push, workflow_dispatch]

permissions:
  contents: write

concurrency:
  group: android-vm
  cancel-in-progress: true

jobs:
  build-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch real ARM64 guest runtime
        working-directory: apps/ayurones-vm
        run: |
          set -e
          mkdir -p app/src/main/assets/guest
          curl -fL --retry 5 --retry-delay 2             -o app/src/main/assets/guest/ayurones-guest.ayr             https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/aarch64/alpine-netboot-3.24.0-aarch64.tar.gz
          cat > app/src/main/assets/guest/README.runtime <<'EOF'
          AYR-GUEST-BUNDLE
          format=2
          base=Alpine Linux 3.24 aarch64 netboot
          architecture=aarch64
          boot_assets=kernel,initramfs,rootfs
          source=https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/aarch64/alpine-netboot-3.24.0-aarch64.tar.gz
          build=0.5.0
          EOF
          SIZE=$(stat -c%s app/src/main/assets/guest/ayurones-guest.ayr)
          echo "Guest runtime bytes: $SIZE"
          test "$SIZE" -ge 400000000

      - name: Build APK
        working-directory: apps/ayurones-vm
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew clean assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK=$(find apps/ayurones-vm/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK bytes: $SIZE"
          test "$SIZE" -ge 400000000
          cp "$APK" Ayurones-VM-v0.5.0-debug.apk
          sha256sum Ayurones-VM-v0.5.0-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayurones-VM-v0.5.0-debug
          path: Ayurones-VM-v0.5.0-debug.apk
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete v0.5.0 --yes 2>/dev/null || true
          gh release create v0.5.0 --target "$GITHUB_SHA" --title "Ayurones VM v0.5.0" --notes "Ayurones VM with a real ARM64 Alpine guest runtime bundle, persistent writable guest overlay, terminal, files, diagnostics, camera/file host APIs and virtual network UI."
          gh release upload v0.5.0 Ayurones-VM-v0.5.0-debug.apk --clobber
