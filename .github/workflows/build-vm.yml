name: Build Ayurones VM

on:
  push:
    branches: ["main"]
    paths:
      - "apps/ayurones-vm/**"
      - ".github/workflows/build-vm.yml"
      - "README.md"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-vm
  cancel-in-progress: true

jobs:
  build-vm:
    name: Build Ayurones VM APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK
        working-directory: apps/ayurones-vm
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew clean assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find apps/ayurones-vm/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" Ayurones-VM-v0.2.0-debug.apk
          sha256sum Ayurones-VM-v0.2.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ayurones-VM-v0.2.0-debug
          path: Ayurones-VM-v0.2.0-debug.apk
          retention-days: 30
      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v0.2.0 --yes 2>/dev/null || true
          gh release create v0.2.0 --target "$GITHUB_SHA" --title "Ayurones VM v0.2.0" --notes "Android sandbox build: isolated app UID, private guest filesystem, no broad device permissions."
          gh release upload v0.2.0 Ayurones-VM-v0.2.0-debug.apk --clobber
