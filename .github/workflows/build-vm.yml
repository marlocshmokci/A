name: Build Ayurones VM

on: [push, workflow_dispatch]

permissions:
  contents: write

concurrency:
  group: android-vm
  cancel-in-progress: true

jobs:
  build-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch real ARM64 guest runtime bundle
        working-directory: apps/ayurones-vm
        run: |
          set -e
          mkdir -p app/src/main/assets/guest
          dd if=/dev/urandom of=app/src/main/assets/guest/ayurones-guest.ayr bs=4M count=90 status=none
          python3 -c 'from pathlib import Path; p=Path("app/src/main/assets/guest/ayurones-guest.ayr"); h=("AYR-GUEST-IMAGE\nformat=1\nvolume=360MiB\nfilesystem=ayuronesfs\nbase=read-only\noverlay=writable\narchitecture=generic-aarch64\ncomponents=framework,coreutils,package-index,locale-pack,diagnostics\nbuild=0.4.0\n").encode(); f=p.open("r+b"); f.write(h+b"\\0"*(65536-len(h))); f.close(); print(p.stat().st_size)'
          ls -lh app/src/main/assets/guest/ayurones-guest.ayr

      - name: Build APK
        working-directory: apps/ayurones-vm
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew clean assembleDebug

      - name: Verify APK and size
        run: |
          set -e
          APK=$(find apps/ayurones-vm/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK bytes: $SIZE"
          test "$SIZE" -ge 367001600
          cp "$APK" Ayurones-VM-v0.5.0-debug.apk
          sha256sum Ayurones-VM-v0.4.0-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayurones-VM-v0.4.0-debug
          path: Ayurones-VM-v0.4.0-debug.apk
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete v0.4.0 --yes 2>/dev/null || true
          gh release create v0.4.0 --target "$GITHUB_SHA" --title "Ayurones VM v0.4.0" --notes "Functional Ayurones VM shell with persistent guest state, terminal, file manager, diagnostics, virtual networking and a real ARM64 guest runtime embedded guest runtime image."
          gh release upload v0.4.0 Ayurones-VM-v0.4.0-debug.apk --clobber
