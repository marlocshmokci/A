name: Build Ayurones Messenger + Test Server

on:
  push:
    branches: ["main"]
    paths:
      - "apps/ayurones-messenger/**"
      - "apps/test-server/**"
      - ".github/workflows/build-messenger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-messenger
  cancel-in-progress: true

jobs:
  build-messenger:
    name: Build Ayurones Messenger installable APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build Messenger
        working-directory: apps/ayurones-messenger
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew clean assembleDebug
      - name: Verify Messenger APK
        run: |
          set -euo pipefail
          APK=$(find apps/ayurones-messenger/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" Ayurones-Messenger-v0.2.1-debug.apk
          stat -c "Messenger APK size: %s bytes" Ayurones-Messenger-v0.2.1-debug.apk
          sha256sum Ayurones-Messenger-v0.2.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ayurones-Messenger-v0.2.1-debug
          path: Ayurones-Messenger-v0.2.1-debug.apk
          retention-days: 30

  build-test-server:
    name: Build Test Server installable APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build Test Server
        working-directory: apps/test-server
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew clean assembleDebug
      - name: Verify Test Server APK
        run: |
          set -euo pipefail
          APK=$(find apps/test-server/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          cp "$APK" Ayurones-Test-Server-v0.2.1-debug.apk
          stat -c "Test Server APK size: %s bytes" Ayurones-Test-Server-v0.2.1-debug.apk
          sha256sum Ayurones-Test-Server-v0.2.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ayurones-Test-Server-v0.2.1-debug
          path: Ayurones-Test-Server-v0.2.1-debug.apk
          retention-days: 30
