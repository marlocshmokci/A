name: Build Ballistic Lab APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check project archive
        run: |
          test -f BallisticLab.zip || (echo "Upload BallisticLab.zip to the repository root, then push again." && exit 1)
          unzip -q BallisticLab.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: cd source && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BallisticLab-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ballistic Lab APK build ${{ github.run_number }}
          generate_release_notes: true
          files: source/app/build/outputs/apk/debug/*.apk
