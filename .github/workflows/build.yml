name: Build Ballistic Lab APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct uploaded project archive
        run: |
          cat .build/source-*.b64 | base64 -d > BallisticLab.zip
          unzip -q BallisticLab.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: cd source && gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BallisticLab-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ballistic Lab APK build ${{ github.run_number }}
          generate_release_notes: true
          files: source/app/build/outputs/apk/debug/*.apk
