name: Build TTAuOI Fixed
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build
        run: gradle :app:assembleDebug
        working-directory: apps/ttauoi
      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify apps/ttauoi/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp apps/ttauoi/app/build/outputs/apk/debug/app-debug.apk dist/TTAuOI-v2.0.5-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TTAuOI-v2.0.5-debug
          path: dist/TTAuOI-v2.0.5-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.5
          name: TTAuOI v2.0.5
          files: dist/TTAuOI-v2.0.5-debug.apk
