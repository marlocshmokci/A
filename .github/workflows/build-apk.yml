
name: Build Ayuron APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Replace legacy repository history once
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[clean-history]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan clean-main
          git add -A
          git commit -m "Ayuron Android app 1.0.0 (clean repository history)"
          git push origin HEAD:main --force
          git tag -f v1.0.0
          git push origin refs/tags/v1.0.0 --force

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayuron-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Ayuron Android 1.0.0
          body: |
            Android app without Telegram.
            All three app model choices are unlocked.
            Quotas: 20 text requests and 8 media requests per UTC day.
            Configure a Cloudflare Worker using the README, then enter its HTTPS URL in app settings.
            The Gemini API key is stored as a Worker secret; it is not in the APK.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
