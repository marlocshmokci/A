<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayurones Drops v0.2.0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,sans-serif;color:#000}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:14px;left:14px;font-weight:800;font-size:20px;z-index:2}
#help{position:fixed;right:14px;top:14px;opacity:.55;font-size:13px}
</style>
</head>
<body>
<div id="ui">Счёт: <span id="score">0</span> · Рекорд: <span id="best">0</span></div>
<div id="help">Двигай чашу мышью / пальцем</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let W=innerWidth,H=innerHeight,drops=[],score=0,best=Number(localStorage.ayuronesDropsBest||0),cup={x:W/2,y:H-70,w:150,h:42},target=cup.x;
bestEl.textContent=best;
function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cup.y=H-70}
addEventListener('resize',resize);resize();
function move(e){target=(e.touches?e.touches[0].clientX:e.clientX);target=Math.max(cup.w/2,Math.min(W-cup.w/2,target))}
addEventListener('pointermove',move);addEventListener('touchmove',move,{passive:true});
function drop(){drops.push({x:20+Math.random()*(W-40),y:-20,r:7+Math.random()*5,v:2.4+Math.min(score/100,5)+Math.random()*2})}
setInterval(drop,520);
function loop(){
 x.clearRect(0,0,W,H); cup.x+=(target-cup.x)*.18;
 for(let i=drops.length-1;i>=0;i--){
  let d=drops[i];d.y+=d.v;
  const hit=d.y+d.r>=cup.y && d.y-d.r<=cup.y+cup.h && d.x>=cup.x-cup.w/2 && d.x<=cup.x+cup.w/2;
  if(hit){score++;scoreEl.textContent=score; if(score>best){best=score;localStorage.ayuronesDropsBest=best;bestEl.textContent=best}drops.splice(i,1);continue}
  if(d.y>H+30)drops.splice(i,1);
  else {x.beginPath();x.fillStyle='#000';x.ellipse(d.x,d.y,d.r,d.r*1.35,0,0,Math.PI*2);x.fill()}
 }
 x.fillStyle='#000';x.beginPath();x.roundRect(cup.x-cup.w/2,cup.y,cup.w,cup.h,18);x.fill();
 x.fillStyle='#fff';x.fillRect(cup.x-cup.w/2+9,cup.y+7,cup.w-18,7);
 requestAnimationFrame(loop)
}
loop();
</script>
</body>
</html>
