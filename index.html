<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Ayuron AI</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#292929;--text:#f3f3f3;--muted:#aaa;--accent:#3867ed;--bubble:#272727}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif;height:100dvh;overflow:hidden}button,input,textarea{font:inherit}button{color:inherit;border:0;cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto}.top{display:flex;align-items:center;gap:12px;padding:16px 14px;padding-top:max(16px,env(safe-area-inset-top))}.circle{width:54px;height:54px;border-radius:50%;background:var(--panel);font-size:24px;flex-shrink:0}.connect{background:#3b4148;color:#66b8ff;border-radius:36px;padding:16px 22px;font-weight:650;font-size:18px;flex:1;max-width:280px}.top .new{margin-left:auto}.content{flex:1;overflow:auto;padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px}.welcome{margin:auto 0 0;display:flex;flex-direction:column;gap:8px;padding:0 4px 24px}.suggest{display:flex;align-items:center;gap:18px;background:transparent;text-align:left;padding:12px 0;font-size:18px;color:#ddd}.msg{max-width:88%;padding:13px 16px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.user{align-self:flex-end;background:var(--bubble)}.assistant{align-self:flex-start;background:var(--bubble)}.composer-wrap{padding:8px 14px max(14px,env(safe-area-inset-bottom));}.composer{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:32px;padding:8px 12px}.composer input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:var(--text);padding:8px 0;font-size:17px}.plus{font-size:28px;background:transparent}.send{width:46px;height:46px;border-radius:50%;background:var(--accent);font-size:20px}.drawer{position:fixed;inset:0;background:#0009;display:none;z-index:4}.drawer.open{display:block}.side{height:100%;width:min(84vw,330px);background:#171717;padding:20px;display:flex;flex-direction:column;gap:12px}.side button,.settings button{padding:12px;border-radius:12px;background:#2a2a2a;text-align:left}.history{overflow:auto;display:flex;flex-direction:column;gap:6px}.history button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.settings{background:#181818;border:1px solid #333;border-radius:20px;padding:20px;width:min(100%,420px);display:flex;flex-direction:column;gap:14px}.settings input,.settings select{width:100%;background:#292929;color:white;border:1px solid #444;border-radius:10px;padding:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.tiny{font-size:12px;color:var(--muted)}@media(min-width:650px){.content{padding-left:30px;padding-right:30px}.welcome{max-width:600px;width:100%;margin: auto auto 0}.composer-wrap{padding-left:30px;padding-right:30px}}
</style></head><body><div class="app"><header class="top"><button class="circle" id="menu" aria-label="Меню">☰</button><button class="connect" id="connect">✦ Подключить</button><button class="circle new" id="newchat" aria-label="Новый чат">◌</button></header><main class="content" id="messages"><section class="welcome" id="welcome"><button class="suggest" data-prompt="Создай изображение: "><span>▧</span> Создать изображение</button><button class="suggest" data-prompt="Помоги написать или отредактировать текст: "><span>✎</span> Напиши или отредактируй</button><button class="suggest" data-prompt="Найди в интернете информацию о: "><span>◎</span> Искать в интернете</button></section></main><footer class="composer-wrap"><form class="composer" id="form"><button class="plus" type="button" id="tools">＋</button><input id="prompt" placeholder="Спросить Ayuron..." autocomplete="off"><button class="send" aria-label="Отправить">↑</button></form></footer></div>
<div class="drawer" id="drawer"><nav class="side"><div class="row"><strong>Ayuron AI</strong><button id="closemenu">✕</button></div><button id="newside">＋ Новый чат</button><button id="openSettings">⚙ Настройки и оформление</button><button id="plugins">🧩 Плагины GitHub</button><strong>История чатов</strong><div class="history" id="history"></div></nav></div>
<div class="modal" id="modal"><section class="settings"><div class="row"><strong>Настройки Ayuron</strong><button id="closeSettings">✕</button></div><label>Цвет акцента<input id="accent" type="color" value="#3867ed"></label><label>Тема<select id="theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label><label>Адрес API<input id="api" placeholder="https://your-worker.workers.dev/chat"></label><label>Модель Groq<input id="model" value="llama-3.3-70b-versatile"></label><p class="tiny">API-ключ не вводится в приложение: он должен храниться в секрете на сервере.</p><button id="save">Сохранить настройки</button><button id="clear">Удалить всю историю чатов</button></section></div>
<script>
const $=id=>document.getElementById(id);let chats=JSON.parse(localStorage.getItem('ayuron_chats')||'[]'),current=null,settings=JSON.parse(localStorage.getItem('ayuron_settings')||'{}');function saveChats(){localStorage.setItem('ayuron_chats',JSON.stringify(chats))}function fresh(){current={id:Date.now(),title:'Новый чат',messages:[],updated:Date.now()};chats.unshift(current);saveChats();render();$('prompt').focus()}function ensure(){if(!current)fresh()}function render(){const root=$('messages');root.innerHTML='';if(!current||!current.messages.length){const w=document.createElement('section');w.className='welcome';[['▧','Создать изображение','Создай изображение: '],['✎','Напиши или отредактируй','Помоги написать или отредактировать текст: '],['◎','Искать в интернете','Найди информацию о: ']].forEach(([icon,label,p])=>{const b=document.createElement('button');b.className='suggest';b.textContent=icon+'  '+label;b.onclick=()=>{$('prompt').value=p;$('prompt').focus()};w.append(b)});root.append(w)}else current.messages.forEach(m=>{const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.content;root.append(d)});root.scrollTop=root.scrollHeight;renderHistory()}function renderHistory(){const h=$('history');h.innerHTML='';chats.forEach(c=>{const b=document.createElement('button');b.textContent=c.title||'Новый чат';b.onclick=()=>{current=c;$('drawer').classList.remove('open');render()};h.append(b)})}async function send(text){text=(text||$('prompt').value).trim();if(!text)return;ensure();$('prompt').value='';current.messages.push({role:'user',content:text});if(current.messages.length===1)current.title=text.slice(0,38);current.updated=Date.now();saveChats();render();const wait={role:'assistant',content:'Думаю…'};current.messages.push(wait);render();try{const endpoint=settings.api||$('api').value.trim();if(!endpoint)throw Error('Сначала откройте меню → Настройки и укажите адрес своего API Worker.');const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:current.messages.filter(m=>m!==wait),model:settings.model||$('model').value||'llama-3.3-70b-versatile'})});const data=await response.json();if(!response.ok)throw Error(data.error||'Ошибка API '+response.status);wait.content=data.reply||data.choices?.[0]?.message?.content||'Сервер вернул пустой ответ.'}catch(e){wait.content='Не удалось получить ответ: '+e.message}saveChats();render()}$('form').onsubmit=e=>{e.preventDefault();send()};$('menu').onclick=()=>$('drawer').classList.add('open');$('closemenu').onclick=()=>$('drawer').classList.remove('open');$('newchat').onclick=fresh;$('newside').onclick=()=>{$('drawer').classList.remove('open');fresh()};$('openSettings').onclick=()=>{$('drawer').classList.remove('open');$('modal').classList.add('open');$('api').value=settings.api||'';$('model').value=settings.model||'llama-3.3-70b-versatile';$('accent').value=settings.accent||'#3867ed';$('theme').value=settings.theme||'dark'};$('closeSettings').onclick=()=>$('modal').classList.remove('open');$('connect').onclick=()=>$('openSettings').click();$('save').onclick=()=>{settings={api:$('api').value.trim(),model:$('model').value.trim(),accent:$('accent').value,theme:$('theme').value};localStorage.setItem('ayuron_settings',JSON.stringify(settings));document.documentElement.style.setProperty('--accent',settings.accent);if(settings.theme==='light'){document.documentElement.style.setProperty('--bg','#f5f5f5');document.documentElement.style.setProperty('--text','#111');document.documentElement.style.setProperty('--panel','#e2e2e2');document.documentElement.style.setProperty('--bubble','#e7e7e7')}else{document.documentElement.style.setProperty('--bg','#000');document.documentElement.style.setProperty('--text','#f3f3f3');document.documentElement.style.setProperty('--panel','#292929');document.documentElement.style.setProperty('--bubble','#272727')} $('modal').classList.remove('open')};$('clear').onclick=()=>{if(confirm('Удалить всю историю чатов?')){chats=[];current=null;saveChats();render()}};$('tools').onclick=()=>alert('Плагины подключаются отдельно через GitHub. Нажмите «Плагины GitHub» в меню.');$('plugins').onclick=()=>{const repo=prompt('Введите GitHub-репозиторий плагина (owner/repo). Плагин должен содержать manifest.json.');if(!repo)return;alert('Загрузка плагинов пока в разработке. Репозиторий: '+repo+'\nСледующий этап — безопасный загрузчик манифестов и разрешений.')};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.prompt;$('prompt').focus()});if(settings.accent)document.documentElement.style.setProperty('--accent',settings.accent);render();
</script></body></html>
